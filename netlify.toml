[build]
  command = "npm run build"
  publish = "dist"

# Security headers applied to all routes
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: adjust script/connect origins as GTM and Google Ads are added
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com; font-src 'self'; frame-src https://www.googletagmanager.com; object-src 'none'; base-uri 'self'"

# Cache static assets aggressively
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Never cache robots.txt or sitemap
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Redirects: non-www → www
[[redirects]]
  from = "https://sbs-containerservice.de/*"
  to = "https://www.sbs-containerservice.de/:splat"
  status = 301
  force = true

# Landing pages: serve /lp/* at anfrage.sbs-containerservice.de without the /lp/ prefix
# e.g. anfrage.sbs-containerservice.de/buerocontainer-kaufen → serves /lp/buerocontainer-kaufen
[[redirects]]
  from = "https://anfrage.sbs-containerservice.de/:page"
  to = "/lp/:page"
  status = 200

[[redirects]]
  from = "https://www.anfrage.sbs-containerservice.de/:page"
  to = "/lp/:page"
  status = 200

# Redirect bare anfrage root to www
[[redirects]]
  from = "https://anfrage.sbs-containerservice.de"
  to = "https://www.sbs-containerservice.de"
  status = 301
  force = true

[[redirects]]
  from = "https://www.anfrage.sbs-containerservice.de"
  to = "https://www.sbs-containerservice.de"
  status = 301
  force = true
