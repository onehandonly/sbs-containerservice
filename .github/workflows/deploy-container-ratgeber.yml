# Baut und veröffentlicht Container-Ratgeber.de über GitHub Pages.
#
# Voraussetzungen (einmalig im Repository einstellen):
#   - Settings → Pages → "Build and deployment" → Source: "GitHub Actions"
#   - Settings → Pages → Custom domain: container-ratgeber.de (schreibt/prüft public/CNAME)
#
# Hinweis: Das Projekt liegt im Unterordner "Container-Ratgeber.de".
# Wird der Ordner später in ein eigenes Repository ausgelagert, sind die
# "working-directory"- und "path"-Angaben auf das Repo-Root anzupassen.
name: Deploy Container-Ratgeber.de

on:
  push:
    branches: [main]
    paths:
      - 'Container-Ratgeber.de/**'
      - '.github/workflows/deploy-container-ratgeber.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein gleichzeitiges Deployment; laufende Läufe werden nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Container-Ratgeber.de
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: Container-Ratgeber.de/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Container-Ratgeber.de/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
